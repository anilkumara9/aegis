[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.3.0"
description = "Aegis — defensive guard agent. Deep hacking knowledge pointed entirely at defense."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis*"]

[tool.setuptools.package-data]
aegis = ["kb/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
