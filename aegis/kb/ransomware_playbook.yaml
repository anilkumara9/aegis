  - id: AEG-T124
    name: "Affiliate-vs-Operator Split (Attribution and Defense Impact)"
    category: ransomware_playbook
    description: >-
      In the RaaS economy, the operator (who builds the malware and runs
      the leak site) and the affiliate (who breaks in and detonates it) are
      different actors with different skills, toolsets, and even
      motivations. This split is why attacks under one brand name — LockBit
      being the prime example — vary so wildly in TTPs: the malware is
      constant, the humans are not. For defenders, the split means brand
      attribution is nearly useless for detection; the stable unit of
      analysis is the behavior chain, and for responders it means
      negotiation dynamics depend on which affiliate holds the keys.
    how_it_works: >-
      Operators recruit, vet, and take a cut (historically 20-30%);
      affiliates bring their own initial access, tooling preferences, and
      negotiation style. The split creates observable seams: affiliates
      defect between brands (Coveware notes fluid movement as RaaS trust
      collapsed), use different toolsets per intrusion, and sometimes lose
      access to decryptors when operators are disrupted by law
      enforcement — leaving victims with no one to pay. The Conti leaks
      exposed the operator side's internal organization (salaries, shifts,
      management chats), while affiliate-side variance explains why one
      'LockBit' incident looks nothing like another. Defenders exploit the
      split by disrupting the operator's shared infrastructure (leak sites,
      payment portals), which strands all affiliates at once.
    variants:
      - "Stable-operator / fluid-affiliate: one brand's infrastructure serving many independent intrusion teams with different TTPs."
      - "Affiliate defection: operators losing affiliates to rival brands after disputes, taking their access pipelines with them."
      - "Operator disruption stranding affiliates: takedowns removing decryptors and negotiators mid-incident."
    indicators:
      - "Incidents attributed to one ransomware brand showing sharply different toolsets, dwell times, or negotiation styles."
      - "Threat-intel reporting of affiliate movement between brands or public disputes between operators and affiliates."
      - "Victims unable to reach negotiators or obtain working decryptors after a law-enforcement action against the operator."
      - "Leaked operator communications (as with Conti) revealing internal structure that does not match observed affiliate tradecraft."
    detection:
      rule: detect_affiliate_operator_seams
      patterns:
        - '(?i)(same.brand|same.ransomware).*(different.(toolset|ttp|dwell)|ttp.variance)'
        - '(?i)(affiliate.*defect|operator.*dispute|brand.*(collapse|rebrand|exit.scam))'
        - '(?i)(decryptor|negotiat).*(unavailable|no.response).*(takedown|seizure)'
    severity: low
    mitigations:
      - "Build detections on behavior chains (access → lateral → exfil → encrypt), not on ransomware brand names or file hashes."
      - "Support and publicize law-enforcement actions against operator infrastructure — the highest-leverage disruption point."
      - "In incident response, verify decryptor viability and negotiator reachability before any payment discussion; operator disruption can void the transaction."
      - "Track affiliate toolsets independently of brands in threat-intel profiles."
    examples:
      - summary: "The CISA/FBI LockBit advisory explicitly warns that the large number of unconnected affiliates makes LockBit attacks vary significantly in observed TTPs — the canonical statement of the affiliate-operator attribution problem."
        reference: "https://www.securitymagazine.com/articles/print/99504-cisa-releases-information-on-lockbit"
      - summary: "Coveware's Q2 2022 analysis describes how the Conti leaks exposed RaaS shared-service labor pools to moles and systemic collapse, driving sophisticated affiliates to operate independently and making attribution harder."
        reference: "http://coveware.com/blog/2022/7/27/fewer-ransomware-victims-pay-as-medium-ransom-falls-in-q2-2022?format=amp&ref=hackernoon.com"
    references:
      - "https://www.securitymagazine.com/articles/print/99504-cisa-releases-information-on-lockbit"
      - "http://coveware.com/blog/2022/7/27/fewer-ransomware-victims-pay-as-medium-ransom-falls-in-q2-2022?format=amp&ref=hackernoon.com"
      - "http://coveware.com/2025/10/insider-threats-loom-while-ransom-payment-rates-plummet/"

  - id: AEG-T125
    name: "Backup Destruction TTPs"
    category: ransomware_playbook
    description: >-
      Affiliates systematically destroy backups before detonating the
      encryptor, because intact backups collapse their leverage. Typical
      targets: Volume Shadow Copies, backup-server agents and catalogs,
      hypervisor snapshots, and cloud backup credentials. CISA's
      #StopRansomware guidance answers directly: maintain offline,
      encrypted backups and regularly test restoration. Backup destruction
      is often the earliest high-confidence signal that a ransomware
      detonation is imminent — it happens in the staging phase, before
      encryption begins.
    how_it_works: >-
      After reaching domain-level access, affiliates enumerate backup
      infrastructure (backup servers, NAS targets, cloud backup consoles),
      delete shadow copies and snapshots, stop or uninstall backup agents,
      corrupt backup catalogs, and — increasingly — compromise cloud backup
      credentials to delete immutable-seeming copies. Variants: local
      shadow-copy and snapshot deletion; backup-server targeting (agent
      removal, repository wiping); and cloud-console compromise to attack
      off-site copies. Detection: any backup-deletion or agent-stop event
      outside a maintenance window is treated as a pre-detonation alarm.
    variants:
      - "Local recovery destruction: shadow-copy deletion and recovery-partition tampering on endpoints and servers."
      - "Backup-server targeting: backup agents stopped or uninstalled, repositories and catalogs wiped."
      - "Cloud backup compromise: backup-console credentials abused to delete or corrupt off-site and 'immutable' copies."
    indicators:
      - "Shadow-copy deletion or snapshot removal commands executed outside any change window."
      - "Backup agents stopped, uninstalled, or losing heartbeat across many hosts in a short window."
      - "Backup repository free-space spikes or catalog corruption inconsistent with retention policies."
      - "Logons to backup consoles or cloud backup portals from unusual accounts, hosts, or geographies."
    detection:
      rule: detect_backup_destruction
      patterns:
        - '(?i)(vssadmin|wmic).*(delete.*shadows|shadowcopy.*delete)'
        - '(?i)(backup.agent|veeam|acronis|commvault).*(stop|uninstall|disable|heartbeat.lost)'
        - '(?i)(snapshot|recovery.point).*(delete|revert).*(off.hours|no.ticket)'
    severity: high
    mitigations:
      - "3-2-1-1-0 backup strategy: three copies, two media, one off-site, one offline/air-gapped or immutable — tested by actual restoration."
      - "Separate backup credentials and network segment: backup infrastructure must not be reachable with domain-admin credentials from user networks."
      - "Immutable and object-locked backups (WORM storage, cloud object lock) so even compromised consoles cannot delete them."
      - "Alert on ANY backup-deletion, agent-stop, or snapshot-removal event as a pre-detonation indicator with automated isolation."
    examples:
      - summary: "CISA's ransomware guidance (via the #StopRansomware Guide) makes offline, encrypted, regularly tested backups the centerpiece recommendation — a direct response to affiliates' systematic backup-destruction playbooks."
        reference: "https://www.threatlocker.com/blog/cisa-releases-updated-stopransomware-guide?utm_source=tldr&%3Butm_medium=word-copy-ad&%3Butm_campaign=2024-06-webianr-how-to-prevent-ransomware&%3Butm_term=save-your-spot-now"
      - summary: "Maze and its successors routinely staged data theft and backup/recovery sabotage before encryption, which is why CISA warns that paying the ransom is not a solution — many payers found data corrupted or were attacked again."
        reference: "https://stoneridgesoftware.com/cisas-tips-how-avoid-and-respond-ransomware/"
    references:
      - "https://www.threatlocker.com/blog/cisa-releases-updated-stopransomware-guide?utm_source=tldr&%3Butm_medium=word-copy-ad&%3Butm_campaign=2024-06-webianr-how-to-prevent-ransomware&%3Butm_term=save-your-spot-now"
      - "https://stoneridgesoftware.com/cisas-tips-how-avoid-and-respond-ransomware/"
      - "https://www.gao.gov/products/gao-22-104767?order=field_status_code&sort=asc"

  - id: AEG-T126
    name: "Negotiation-Phase Indicators"
    category: ransomware_playbook
    description: >-
      The negotiation phase — ransom notes, victim chat portals, deadline
      timers, and 'customer service' chats — is itself a rich intelligence
      source. How the other side behaves reveals the operation's maturity:
      professional negotiators with working decryptors versus disorganized
      affiliates who may not even control decryption. Coveware's data shows
      victims negotiate aggressively (actual payments averaging ~8.7% of
      initial demands in 2025 reporting) and that most professionally
      managed incidents now end without payment. Defenders use
      negotiation-phase signals to assess decryptor viability, buy time for
      recovery, and feed law enforcement.
    how_it_works: >-
      After detonation, victims find ransom notes pointing to Tor chat
      portals; operators or affiliates negotiate price, 'prove' decryption
      with free file tests, and set escalating deadlines (including
      leak-site countdowns). Variants: operator-run professional
      negotiation desks (mature RaaS); affiliate-run chats with erratic
      pricing and broken decryptors; and negotiator-mediated talks via
      incident-response firms, which is now the norm for insured victims.
      Key defender reads: whether the decryptor actually works (test on
      samples), whether deadlines slip (sign of disorganization or
      bluffing), and whether the same wallet/chat infrastructure links to
      other victims (attribution).
    variants:
      - "Professional negotiation desks: operator-run portals with working decryptors, free test decryptions, and structured discounting."
      - "Affiliate-run chats: erratic pricing, missed deadlines, and sometimes non-functional decryptors."
      - "IR-firm-mediated negotiation: professional incident responders handling talks, now standard for insured victims."
    indicators:
      - "Ransom notes and Tor portal URLs appearing across the environment — capture them as evidence, not just for reading."
      - "Decryptor test results: failed or partial test decryptions indicating the affiliate cannot actually recover data."
      - "Deadline extensions, price collapses, or contradictory messages suggesting disorganization or multiple actors."
      - "Wallet addresses or chat handles reused across incidents — pivot points for attribution and law-enforcement referral."
    detection:
      rule: detect_negotiation_phase
      patterns:
        - '(?i)(ransom.note|tor.*chat|decrypt.*portal).*(found|accessed|observed)'
        - '(?i)(deadline.*(extended|missed)|price.*(collapse|discount)).*(negotiat)'
        - '(?i)(btc|wallet|monero).*(address).*(reused|shared|cluster)'
    severity: low
    mitigations:
      - "Engage law enforcement (FBI field office / IC3) and counsel before any communication — never negotiate alone."
      - "Use professional incident-response negotiators; do not let the adversary set the tempo or learn your recovery state."
      - "Test decryptors on samples and verify key viability; a non-working decryptor changes the entire decision."
      - "Preserve all negotiation artifacts (notes, portal URLs, wallets, chats) for attribution and potential key recovery from later takedowns."
    examples:
      - summary: "Coveware's Q2 2022 data showed the average ransom payment at $228,125 while the median fell 51% to $36,360 — evidence that aggressive negotiation was already compressing what victims actually paid."
        reference: "http://coveware.com/blog/2022/7/27/fewer-ransomware-victims-pay-as-medium-ransom-falls-in-q2-2022?format=amp&ref=hackernoon.com"
      - summary: "2025-2026 industry analysis drawing on Coveware data found actual payments averaging ~8.7% of initial demands, with a record non-payment rate — the negotiation phase is where most ransom value is now destroyed."
        reference: "https://cnicsolutions.com/statistics/ransomware/ransomware-payout-statistics-2026/"
    references:
      - "http://coveware.com/blog/2022/7/27/fewer-ransomware-victims-pay-as-medium-ransom-falls-in-q2-2022?format=amp&ref=hackernoon.com"
      - "https://cnicsolutions.com/statistics/ransomware/ransomware-payout-statistics-2026/"
      - "http://coveware.com/2025/10/insider-threats-loom-while-ransom-payment-rates-plummet/"
